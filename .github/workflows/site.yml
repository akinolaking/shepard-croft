name: Shepard Croft website checks
on:
  push:
    branches: [feature/html-astryx-site-v1.1.0, feature/visual-qa-v1.3.0]
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'seo-pages.mjs'
      - 'vercel.json'
      - 'index.html'
      - '.github/workflows/site.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  visual-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - run: npm run build
      - run: npm run qa:visual
      - name: Upload full-page and 4x4 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shepard-croft-visual-qa
          path: qa/
          if-no-files-found: ignore
          retention-days: 14