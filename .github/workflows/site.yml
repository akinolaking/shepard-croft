name: Shepard Croft website checks
on:
  push:
    branches: [feature/html-astryx-site-v1.1.0]
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/site.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build